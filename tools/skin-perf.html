<!doctype html>
<meta charset="utf-8" />
<title>skin-perf</title>
<style>
  body { margin: 0; background: #10141a; color: #e8eef4; font: 13px/1.6 system-ui; }
  #out { position: fixed; left: 12px; top: 12px; background: #0008; padding: 10px 14px; white-space: pre; }
</style>
<div id="out">ölçülüyor…</div>
<script type="module">
  // skin-perf.html — S14: "skinned karakter mobilde kaça patlar" sorusunu SAYIYA çevirir.
  //
  // NEDEN: bugün müşteriler TEK InstancedMesh (Customers.tsx, NPC_CAP 128 → 1 çizim çağrısı).
  // Kodun kendi notu "Faz 6'da .glb gelince o ayrı bir karar (skinned mesh instancing farklı)"
  // diyor ve o karar hiç ölçülmedi. Skinned mesh instance EDİLEMEZ: her gövde kendi iskeletini
  // ve kendi AnimationMixer'ını taşır. Bu sayfa iki kolu aynı tarayıcıda, aynı kadraj yükünde
  // koşturur ve KARE SÜRESİNİ ölçer.
  //
  //   /tools/skin-perf.html?n=24&model=Ranger
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  import { clone as skinKlon } from 'three/examples/jsm/utils/SkeletonUtils.js';
  import { mergeGeometries } from 'three/examples/jsm/utils/BufferGeometryUtils.js';

  const q = new URLSearchParams(location.search);
  const N = Number(q.get('n') ?? 24);
  const model = q.get('model') ?? 'Ranger';
  const H = 1.75, R = 0.3;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
  cam.position.set(0, 6, 14);
  cam.lookAt(0, 0.9, 0);

  const yerler = Array.from({ length: N }, (_, i) => [((i % 8) - 3.5) * 1.3, Math.floor(i / 8) * 1.6 - 1.6]);

  /** Bir kolu 120 kare koştur, ortalama kare süresini ve çizim çağrısını döndür. */
  async function kos(ad, sahne, guncelle) {
    sahne.add(new THREE.HemisphereLight('#ffffff', '#7a8896', 2.4));
    for (let i = 0; i < 30; i++) { guncelle(1 / 60); renderer.render(sahne, cam); } // ısınma
    renderer.info.reset();
    const t0 = performance.now();
    const KARE = 120;
    for (let i = 0; i < KARE; i++) {
      guncelle(1 / 60);
      renderer.render(sahne, cam);
    }
    await new Promise((r) => requestAnimationFrame(r));
    const sure = (performance.now() - t0) / KARE;
    return { ad, msKare: +sure.toFixed(2), cizim: renderer.info.render.calls, ucgen: renderer.info.render.triangles };
  }

  // --- KOL 1: bugünkü InstancedMesh kapsül (Customers.tsx'in birebir geometrisi) ---
  const s1 = new THREE.Scene();
  const geo = new THREE.CapsuleGeometry(R, H - 2 * R, 6, 10).translate(0, H / 2, 0);
  const inst = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color: '#c9a227' }), N);
  s1.add(inst);
  const kukla = new THREE.Object3D();
  let t1 = 0;
  const g1 = (dt) => {
    t1 += dt;
    for (let i = 0; i < N; i++) {
      kukla.position.set(yerler[i][0], Math.sin(t1 * 2 + i) * 0.02, yerler[i][1]);
      kukla.rotation.y = t1 + i;
      kukla.updateMatrix();
      inst.setMatrixAt(i, kukla.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  };

  // --- KOL 2: N adet skinned karakter, her biri kendi mixer'ıyla ---
  const loader = new GLTFLoader();
  const g = await loader.loadAsync(`/assets/models/kaykit-characters/${model}.glb`);
  const klipler = (await loader.loadAsync('/assets/models/kaykit-characters/Rig_Medium_MovementBasic.glb')).animations;
  const yuru = klipler.find((c) => c.name === 'Walking_A') ?? klipler[0];
  const s2 = new THREE.Scene();
  const mixerler = [];
  for (let i = 0; i < N; i++) {
    // SkeletonUtils.clone ŞART: scene.clone(true) skinned mesh'te kemikleri ÖZGÜN iskelete
    // bağlı bırakır → bütün kopyalar tek bir iskeleti paylaşır ve aynı anda aynı pozu alır.
    // Model.tsx bugün düz `scene.clone(true)` kullanıyor; skinned'e geçerken değişmesi gereken yer.
    const o = skinKlon(g.scene);
    const kutu = new THREE.Box3().setFromObject(o);
    const k = H / kutu.getSize(new THREE.Vector3()).y;
    o.scale.multiplyScalar(k);
    o.position.set(yerler[i][0], 0, yerler[i][1]);
    s2.add(o);
    const m = new THREE.AnimationMixer(o);
    m.clipAction(yuru).play();
    m.setTime(i * 0.17); // faz kaydır: hepsi aynı karede olmasın
    mixerler.push(m);
  }
  const g2 = (dt) => mixerler.forEach((m) => m.update(dt));

  // --- KOL 3 (S15): SEVK EDİLECEK BİÇİM — baş ayrı, gövde birleşik (gövde başına 2 çizim) ---
  //
  // NEDEN İKİ MESH, NEDEN BİR DEĞİL: ilk ölçüm gövdenin 6 sivil mesh'inin TEK materyali
  // olduğunu gösterdi (`docs/olcum-yuruyus.json` §C_cizim) ve "hepsi tek çizime iner" dedi.
  // UYGULAMADA ÇAKIŞTI: oyunun kuralı başı BOYAMAmak (yüz, saç ve sakal başın kendi
  // dokusundan gelir — boyanınca saç da ten oluyor, D-112), kıyafeti ise düz boyamak. Tek
  // materyal ikisini birden yapamaz: ya doku herkese uygulanır ya kimseye. O yüzden sevk
  // edilen biçim İKİ mesh — baş dokulu materyalini korur, kol+gövde+bacak tek geometriye
  // kaynar ve rengini KÖŞE RENGİNDEN alır (gömlek ve pantolon aynı mesh'te, ayrı renkte).
  //
  // Kol 2 (6 parça) ile kol 4 (tek mesh) arasındaki gerçek yer burasıdır; sayı tahmin
  // edilmeyip ölçülür, çünkü müşteri bütçesi (`NPC_SKIN_CAP`) bu sayıdan türüyor.
  const basMi = (ad) => /head|skull/i.test(ad ?? '');
  const s3 = new THREE.Scene();
  const mixerler3 = [];
  for (let i = 0; i < N; i++) {
    const o = skinKlon(g.scene);
    const parcalar = [];
    o.traverse((n) => {
      if (n.isSkinnedMesh) parcalar.push(n);
    });
    const bas = parcalar.filter((p) => basMi(p.name));
    const govde = parcalar.filter((p) => !basMi(p.name));
    const ana = parcalar[0];
    const ust = ana.parent ?? o;
    parcalar.forEach((p) => p.parent?.remove(p));
    for (const kume of [bas, govde]) {
      if (!kume.length) continue;
      const geo = mergeGeometries(kume.map((p) => p.geometry.clone()), false);
      const mesh = new THREE.SkinnedMesh(geo, kume[0].material);
      mesh.bind(ana.skeleton, ana.bindMatrix);
      ust.add(mesh);
    }
    const kutu = new THREE.Box3().setFromObject(o);
    const k = H / kutu.getSize(new THREE.Vector3()).y;
    o.scale.multiplyScalar(k);
    o.position.set(yerler[i][0], 0, yerler[i][1]);
    s3.add(o);
    const m = new THREE.AnimationMixer(o);
    m.clipAction(yuru).play();
    m.setTime(i * 0.17);
    mixerler3.push(m);
  }
  const g3 = (dt) => mixerler3.forEach((m) => m.update(dt));

  const sonuc = [
    await kos('instanced kapsül (bugün)', s1, g1),
    await kos(`${N}× skinned ${model} (6 parça)`, s2, g2),
    await kos(`${N}× skinned ${model} (baş+gövde, SEVK)`, s3, g3),
  ];
  const [a, b, c] = sonuc;
  document.getElementById('out').textContent =
    `N = ${N} müşteri · 120 kare ortalaması\n\n` +
    sonuc.map((r) => `${r.ad.padEnd(32)} ${String(r.msKare).padStart(6)} ms/kare  ${String(r.cizim).padStart(4)} çizim  ${r.ucgen} üçgen`).join('\n') +
    `\n\nkapsüle göre: 6 parça ×${(b.msKare / a.msKare).toFixed(1)} kare · birleşik ×${(c.msKare / a.msKare).toFixed(1)} kare` +
    `\nbirleştirmenin kazancı: çizim ${b.cizim} → ${c.cizim} · kare ${b.msKare} → ${c.msKare} ms ` +
    `(${(((b.msKare - c.msKare) / b.msKare) * 100).toFixed(0)}%)`;
  // HANGİ SÜRÜCÜ: başsız Chromium GPU bulamazsa SwiftShader'a (yazılım) düşer ve mutlak
  // sayı telefonla ilgisiz olur. Sürücü adı çıktının yanında durur ki sayı yanlış okunmasın.
  const dbg = renderer.getContext().getExtension('WEBGL_debug_renderer_info');
  const surucu = dbg ? renderer.getContext().getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'bilinmiyor';
  document.getElementById('out').textContent += `

sürücü: ${surucu}`;
  window.__sonuc = { sonuc, surucu };
  document.title = 'hazir';
</script>
