<!doctype html>
<meta charset="utf-8" />
<title>karakter-bak</title>
<style>
  body { margin: 0; background: #eceff1; }
  canvas { display: block; }
</style>
<script type="module">
  // karakter-bak.html — KARAKTER ADAYINI OYUNUN DONMUŞ MOBİLYASIYLA AYNI SAHNEDE ÇİZ.
  //
  // NEDEN (S14): `olcum-karakter.mjs` sayıyı veriyor — KayKit karakterinin BAŞI boyun %50'si,
  // bugünkü sahip gövdesinde %33. Bu farkı sayı anlatmıyor: 1,75'e çekilmiş bir gövdenin
  // masanın (tabla üstü 0,795) ve taburenin (oturak 0,45) yanında NASIL okunduğu görülmeden
  // karara götürülemez — `feedback_reference_scale_trap`: maketten ölçü almadan önce İNSAN
  // boyunu karşılaştır.
  //
  // `sivil=1` verilince EKİPMAN düğümleri (pelerin/miğfer/şapka) gizlenir — panonun
  // "sivilleştirme mesh düzenleme ister" hükmünün doğru olup olmadığı ekranda görülür.
  //
  // Kullanım (sunucuyu `tools/karakter-bak.mjs` kaldırır):
  //   /tools/karakter-bak.html?m=Knight,Rogue,Mannequin_Medium&sivil=1
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

  const q = new URLSearchParams(location.search);
  const adlar = (q.get('m') ?? 'Knight').split(',').filter(Boolean);
  const sivil = q.get('sivil') === '1';
  // `poz=Rig_Medium_Simulation:Sit_Chair_Idle` → BAŞKA bir dosyadaki klibi bu gövdeye uygular.
  // Bu yalnız güzel kare için değil ÖLÇÜMÜN kendisi: klip dosyası ile karakter dosyası ayrı
  // paketlerden geliyor; üç.js parçaları KEMİK ADIYLA eşler. Poz tutuyorsa "aynı rig" hükmü
  // kanıtlanmış olur, tutmuyorsa retarget bedeli kola yazılır.
  const [pozDosya, pozKlip] = (q.get('poz') ?? '').split(':');
  // `olcekler=0.794,0.85,0.95` → TEK modeli birden çok ölçekte yan yana çizer. Soru: KayKit
  // gövdesinin başı boyun %50'si olduğu için TOPLAM BOYU 1,75'e çekmek masayı göğse çıkarıyor;
  // gövdeyi mobilyaya hizalamak ise toplam boyu 1,75'in üstüne taşıyor. Kol seçimi görselle olur.
  const olcekler = (q.get('olcekler') ?? '').split(',').filter(Boolean).map(Number);
  // `boya=1` → PARÇA BAŞINA düz renk + oyunun kendi kasket/bıyık/önlüğü kemiğe takılır.
  //
  // NEDEN (2026-09-14, kullanıcı): *"yapısı boyutu proporsiyonu çok iyi ama bunlar savaş
  // karakteri"*. Ekipmanı sökmek yetmiyor — altından ortaçağ derisi çıkıyor, ve o deri
  // GEOMETRİDE. Manken gövdede o geometri hiç yok: 6 düz parça, ekipman sıfır. Parçalar ayrı
  // mesh olduğu için kıyafet = PARÇA RENGİ (D-013 flat-shaded'in tam da istediği şey), kimlik
  // ise bugün Player.tsx'te zaten elle çizili olan kasket + bıyık + önlükten geliyor.
  const boya = q.get('boya') === '1';
  const P = { skin: '#e0ac69', shirt: '#f3ecd9', pants: '#3e3a36', apron: '#7a2230', cap: '#4a3728', mustache: '#3a2a1d', shoe: '#2e2a26' };
  // Baş BİLEREK listede yok: Adventurer gövdelerinde saç ve sakal BAŞ MESH'İNİN dokusundan
  // geliyor; teni düz boyayınca saç da ten oluyor (ilk vitrin koşusunda birebir bu oldu).
  // Mankenin başı ayrı ele alınır — onun dokusu zaten manken dokusu, kimse için bir şey anlatmıyor.
  const PARCA_RENK = [
    [/arm/i, P.shirt],
    [/body|torso/i, P.shirt],
    [/leg/i, P.pants],
  ];
  const H = 1.75; // ACTOR_HEIGHT (src/config/actor.ts)
  const TABLE_TOP_Y = 0.795; // tableLook.ts — donmuş
  const STOOL_SEAT_Y = 0.45; // tableLook.ts — donmuş
  const ADAY = '/assets/models/kaykit-characters/';
  const KAY = '/assets/models/kaykit-furniture-bits/';

  // olcum-karakter.mjs'deki EKİPMAN listesinin aynısı; rol = adın SON bölümü.
  const EKIPMAN = ['cape', 'cloak', 'helmet', 'visor', 'hood', 'hat', 'crown', 'shoulder',
    'pauldron', 'pauldrons', 'armor', 'sword', 'shield', 'staff', 'wand', 'bow', 'quiver',
    'dagger', 'axe', 'spellbook', 'horn', 'backpack', 'mask'];
  const ekipmanMi = (ad) => {
    const rol = (ad ?? '').split('_').pop().toLowerCase();
    return EKIPMAN.some((k) => rol.startsWith(k) || rol.endsWith(k));
  };

  /**
   * Oyunun KENDİ kimlik parçalarını (kasket · bıyık · önlük) rig'in kemiklerine takar.
   * Bugün bunlar `Player.tsx`'te ilkel şekil olarak zaten çizili; buradaki tek fark artık
   * bir KEMİĞE bağlı olmaları — yani yürüme/oturma klibi onları da taşıyor.
   * Ölçüler ham rig birimindedir (gövde 2,20 ham = 1,75 dünya).
   */
  function kiyafetTak(kok, rol = 'cayci', yuzGerek = true) {
    const kemikler = {};
    kok.traverse((n) => {
      if (n.isBone) kemikler[n.name] = n;
    });
    kok.updateWorldMatrix(true, true);
    const q = new THREE.Quaternion();
    const tak = (kemikAd, mesh, nokta) => {
      const k = kemikler[kemikAd];
      if (!k) return;
      k.add(mesh);
      mesh.position.copy(k.worldToLocal(nokta.clone()));
      mesh.quaternion.copy(k.getWorldQuaternion(q).invert()); // kemiğin dönüşünü geri al
    };
    const mat = (renk) => new THREE.MeshStandardMaterial({ color: renk, roughness: 0.85 });

    // Ham rig ölçüleri (ölçülmüş): baş mesh'i y 1,10…2,20 · gövde 0,38…1,24 · baş eni 0,86.
    // YÜZ: manken boş kafayla geliyor. Göz ve burun bugün `Player.tsx`'te zaten küre olarak
    // çizili (r 0,022 göz · r 0,032 burun, 1,29'luk gövdede) — burada aynı parçalar ham rig
    // ölçeğine çevrilip BAŞ KEMİĞİNE takılıyor.
    if (yuzGerek) {
      for (const yan of [-1, 1]) {
        const goz = new THREE.Mesh(new THREE.SphereGeometry(0.058, 10, 8), mat('#2b2118'));
        tak('head', goz, new THREE.Vector3(yan * 0.17, 1.79, 0.48));
      }
      const burun = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), mat('#d49a55'));
      tak('head', burun, new THREE.Vector3(0, 1.67, 0.52));
    }
    if (rol === 'cayci') {
      const kasket = new THREE.Group();
      kasket.add(new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.47, 0.16, 14), mat(P.cap)));
      const vizor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.045, 0.3), mat(P.cap));
      vizor.position.set(0, -0.06, 0.42);
      kasket.add(vizor);
      tak('head', kasket, new THREE.Vector3(0, 2.06, 0));
    }
    // Bıyık da yalnız mankende: Adventurer'ın kendi bıyığı/sakalı dokusunda var,
    // üstüne ikincisini koymak iki bıyık demek.
    if (yuzGerek && (rol === 'cayci' || rol === 'musteri')) {
      const biyik = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.07, 0.07), mat(P.mustache));
      tak('head', biyik, new THREE.Vector3(0, 1.55, 0.5));
    }
    if (rol === 'cayci' || rol === 'garson') {
      const onluk = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.72, 0.08), mat(P.apron));
      tak('chest', onluk, new THREE.Vector3(0, 0.78, 0.3));
      const bel = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.07, 14), mat(P.apron));
      tak('hips', bel, new THREE.Vector3(0, 0.48, 0));
    }
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor('#eceff1');
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#8d99a6', 2.2));
  const dir = new THREE.DirectionalLight('#fff6e0', 1.6);
  dir.position.set(4, 8, 6);
  scene.add(dir);

  const loader = new GLTFLoader();
  const yuk = async (yol) => (await loader.loadAsync(yol)).scene;

  // --- donmuş mobilya: masa (tabla üstü 0,795) + tabure (oturak 0,45) ---
  const masa = await yuk(`${KAY}table_small.gltf`);
  masa.scale.set(1.05, 0.75, 1.05);
  masa.position.set(-1.9, 0, 0);
  scene.add(masa);
  const tabure = await yuk(`${KAY}chair_stool.gltf`);
  tabure.scale.setScalar(0.9);
  tabure.position.set(-1.0, 0, 0.35);
  scene.add(tabure);

  // --- poz kaynağı: klipler ayrı bir dosyadan gelir (KayKit'in kendi düzeni) ---
  let klipler = [];
  if (pozDosya) {
    const g = await loader.loadAsync(`${ADAY}${pozDosya}.glb`);
    klipler = g.animations;
  }
  const pozUygula = (kok) => {
    const klip = klipler.find((c) => c.name === pozKlip);
    if (!klip) return { tuttu: false, sebep: 'klip yok' };
    const mixer = new THREE.AnimationMixer(kok);
    mixer.clipAction(klip).play();
    mixer.update(klip.duration * 0.5); // klibin ortası — idle'ın nötr karesi
    // Poz gerçekten OTURDU mu: iskeletin kökünden bir kemik, klibin izlerinden biriyle
    // eşleşti mi? (üç.js sessizce atlar; "hiç uymadı" ile "uydu" ancak böyle ayrılır.)
    const adlar = new Set();
    kok.traverse((n) => adlar.add(n.name));
    const izler = klip.tracks.map((t) => t.name.split('.')[0]);
    const eslesen = izler.filter((n) => adlar.has(n)).length;
    return { tuttu: eslesen > 0, eslesen, iz: izler.length };
  };

  // --- adaylar: toplam boy 1,75'e çekilir, ekipman istenirse gizlenir ---
  // `kafalar=1,0.85,0.75,0.65` → TEK gövdeyi baş KEMİĞİ şu ölçeklerde yan yana çizer (S15).
  //
  // NEDEN AYRI KOL: ölçüm KayKit başının gövde boyunun **%47-52**'si olduğunu söylüyor
  // (`docs/olcum-yuruyus.json` §K_kafa); bugünkü ilkel gövdede %33'tü. Kullanıcı "kafalar
  // çok büyük" dedi ama KAÇ küçüleceği sayıyla kapanmaz — siluet kararı, kareyle sorulur.
  // Her kart aynı TOPLAM boya (1,75) çekilir: değişen yalnız başın gövdedeki payı, yani
  // karşılaştırma "küçük karakter mi" değil "küçük kafa mı" sorusunu sorar.
  const kafalar = (q.get('kafalar') ?? '').split(',').filter(Boolean).map(Number);
  const kafaTelafi = q.get('kafaTelafi') !== '0';
  const kartlar = [];
  let x = 0;
  const roller = (q.get('roller') ?? '').split(',').filter(Boolean);
  const liste = roller.length
    ? roller.map((r) => {
        const [a, b] = r.includes(':') ? r.split(':') : [adlar[0], r];
        return { ad: a, zorla: 0, rol: b };
      })
    : kafalar.length
      ? kafalar.flatMap((kf) => adlar.map((a) => ({ ad: a, kafa: kf, rol: 'cayci' })))
      : olcekler.length
      ? olcekler.map((k) => ({ ad: adlar[0], zorla: k, rol: 'cayci' }))
      : adlar.map((ad) => ({ ad, zorla: 0, rol: 'cayci' }));
  for (const { ad, zorla, rol, kafa } of liste) {
    const uzanti = ad.startsWith('Male_') || ad.startsWith('Superhero_') ? 'gltf' : 'glb';
    let o;
    try {
      o = await yuk(`${ADAY}${ad}.${uzanti}`);
    } catch (e) {
      console.error('yüklenemedi', ad, e);
      continue;
    }
    let gizlenen = 0;
    if (sivil) {
      o.traverse((n) => {
        if (n.isMesh && ekipmanMi(n.name)) {
          n.visible = false;
          gizlenen++;
        }
      });
    }
    if (boya) {
      o.traverse((n) => {
        if (!n.isMesh || !n.visible) return;
        const manken = /mannequin/i.test(n.name ?? '');
        const e = manken && /head/i.test(n.name ?? '')
          ? [null, P.skin]
          : PARCA_RENK.find(([d]) => d.test(n.name ?? ''));
        if (e) n.material = new THREE.MeshStandardMaterial({ color: e[1], roughness: 0.85 });
      });
      kiyafetTak(o, rol, /Mannequin/i.test(ad));
    }
    const poz = pozDosya ? pozUygula(o) : null;
    // KAFA KOLU — poz UYGULANDIKTAN sonra: klip `head`in scale izini taşıyorsa mixer bizim
    // ölçeğimizin üstüne yazar, o yüzden sıra bu. Kasket zaten `head`in çocuğu, onunla küçülür.
    //
    // İKİ ALT KOL, ve aradaki fark bu turun asıl takası:
    //   TELAFİLİ (`kafaTelafi=1`)  — toplam boy 1,75'te KALIR. Baş küçülünce gövde o boyu
    //     doldurmak için büyür: omuz genişler, karakter tıknazlaşır (blob sınırı 0,60'a dayanır).
    //   TELAFİSİZ (`kafaTelafi=0`) — gövde ölçeği DEĞİŞMEZ, karakter KISALIR. Omuz aynı kalır,
    //     ama mobilya oranı bozulur (D-076'nın kabul kriteri).
    // Kullanıcı hem "kafalar küçülsün" hem "garsonlar küçülsün" dedi; telafisiz kol ikisini
    // birden verir, bedeli mobilya oranıdır. Karar kareyle verilir.
    o.updateWorldMatrix(true, true);
    const kutuOnce = new THREE.Box3().setFromObject(o);
    const boyOnce = kutuOnce.max.y - kutuOnce.min.y;
    let basPayi = null;
    if (kafa && kafa !== 1) {
      o.traverse((n) => {
        if (n.isBone && n.name === 'head') n.scale.setScalar(kafa);
      });
    }
    // SkinnedMesh sınır kutusunu NESNE düzeyinde önbelleğe alır (`Box3.expandByObject`
    // `object.boundingBox`a bakar ve `computeBoundingBox` bir kez koşar; o hesap kemik
    // dönüşümünü uygular). Yukarıdaki ön-ölçüm bu önbelleği kafa küçülmeden doldurdu —
    // temizlenmezse bütün kartlar aynı sayıyı gösterir (ilk koşuda beş kart da "%42,3" dedi).
    // GEOMETRİ düzeyindeki kutuya DOKUNULMAZ: o bind pozundadır ve null'lanınca çöküyor.
    o.traverse((n) => {
      if (n.isSkinnedMesh) n.boundingBox = null;
    });
    o.updateWorldMatrix(true, true);
    if (kafa) {
      const tum = new THREE.Box3().setFromObject(o);
      const bas = new THREE.Box3();
      o.traverse((n) => {
        if (n.isMesh && n.visible && /head|skull/i.test(n.name ?? '')) bas.union(new THREE.Box3().setFromObject(n));
      });
      const toplam = tum.max.y - tum.min.y;
      if (!bas.isEmpty() && toplam > 0) basPayi = +(((bas.max.y - bas.min.y) / toplam) * 100).toFixed(1);
    }
    const kutu = new THREE.Box3().setFromObject(o);
    const b = kutu.getSize(new THREE.Vector3());
    // Telafisiz kolda ölçek baş KÜÇÜLMEDEN ÖNCEKİ boydan alınır: gövde aynı kalır, boy düşer.
    const k = zorla || (kafa && !kafaTelafi ? H / boyOnce : H / b.y);
    o.scale.multiplyScalar(k);
    o.position.set(x - kutu.min.x * k, -kutu.min.y * k, 0);
    o.traverse((n) => {
      if (n.isMesh) n.castShadow = true;
    });
    scene.add(o);
    // Ölçek kolunda her gövdenin ALTINA bir tabure koy: oturma pozunun kabul kriteri
    // "kalça oturağa geliyor mu" ve o ancak aynı karede görülür.
    let kalca = null;
    if (olcekler.length) {
      const t = tabure.clone(true);
      t.position.set(x, 0, 0);
      scene.add(t);
      // KALÇA YÜKSEKLİĞİ — ve bu sayı ÖLÇEK KOLUNUN kriteri DEĞİL, montaj parametresinin
      // ölçüsü. Oturma klibi gövdeyi rig KÖKÜNE göre yerleştirir; buradaki gövde ise ayağı
      // zemine yapışacak şekilde konumlanıyor (ayakta duran kolun kuralı). Yani çıkan fark
      // modelin kusuru değil, "oturan aktör hangi yükseklikten asılacak" sorusunun cevabı —
      // bugünkü `SEATED_DROP`un skinned karşılığı. Kol seçimi AYAKTA ölçülen ilişkiye bakar.
      o.updateWorldMatrix(true, true);
      o.traverse((n) => {
        if (n.isMesh && /body|torso/i.test(n.name ?? '') && n.visible) {
          const kb = new THREE.Box3().setFromObject(n);
          kalca = +kb.min.y.toFixed(3);
        }
      });
    }
    // OMUZ ENİ — blob kuralının (D-076: 2×CAPSULE_RADIUS = 0,60) baktığı sayı. Kart eni
    // A-poz KOL AÇIKLIĞI, omuz değil; telafili kolun bedeli ancak bu sayıda görünür.
    let omuz = null;
    o.updateWorldMatrix(true, true);
    o.traverse((n) => {
      if (n.isMesh && n.visible && /body|torso/i.test(n.name ?? '')) {
        const kb = new THREE.Box3().setFromObject(n);
        omuz = +(kb.max.x - kb.min.x).toFixed(3);
      }
    });
    kartlar.push({
      kalca, kafa, basPayi, omuz,
      ad, rol, x, hamBoy: +b.y.toFixed(2), olcek: +k.toFixed(3), gizlenen, poz,
      en: +(b.x * k).toFixed(2),
      boy: +(b.y * k).toFixed(2),
    });
    x += Math.max(0.95, b.x * k + 0.35);
  }

  // 1,75 referans çubuğu (kırmızı) — kadrajın sağ ucunda
  const insan = new THREE.Mesh(
    new THREE.BoxGeometry(0.36, H, 0.22),
    new THREE.MeshStandardMaterial({ color: '#d32f2f', transparent: true, opacity: 0.5 }),
  );
  insan.position.set(x + 0.35, H / 2, 0);
  scene.add(insan);

  // donmuş yüksekliklerin çizgileri: tabla üstü 0,795 · oturak 0,45
  for (const [y, renk] of [[TABLE_TOP_Y, '#1565c0'], [STOOL_SEAT_Y, '#2e7d32']]) {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-2.6, y, 0.6),
      new THREE.Vector3(x + 0.8, y, 0.6),
    ]);
    scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: renk })));
  }

  const zemin = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: '#dde4e8' }),
  );
  zemin.rotation.x = -Math.PI / 2;
  zemin.receiveShadow = true;
  scene.add(zemin);
  const grid = new THREE.GridHelper(40, 80, '#b0bec5', '#d3dbe0');
  grid.position.y = 0.001;
  scene.add(grid);

  // VİTRİN KİPİ (`izgara=1`): aday SEÇERKEN soru "mobilyaya göre ne kadar" değil "bu KİM".
  // Tek sıra on adayı 40 px'lik lekeye düşürüyor (S13'te model-bak'ta birebir aynı ders);
  // ızgarada kadraj karakterin üstüne kapanır, mobilya ve insan çubuğu çizilmez.
  const genislik = x + 3.4;
  const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
  const merkez = new THREE.Vector3(x / 2 - 0.9, 0.95, 0);
  if (q.get('izgara') === '1') {
    masa.visible = false;
    tabure.visible = false;
    insan.visible = false;
    cam.fov = 30;
    const ortaX = x / 2 - 0.5;
    // Uzaklık eni kapsasın: yarı-en / tan(yatay yarı-açı). Aspect çarpanı unutulunca kesiyor.
    const yariYatay = Math.atan(Math.tan((30 * Math.PI) / 360) * (innerWidth / innerHeight));
    cam.position.set(ortaX, 1.2, (x / 2 + 0.8) / Math.tan(yariYatay) + 1.2);
    cam.lookAt(ortaX, 0.95, 0);
    cam.updateProjectionMatrix();
  } else cam.position.set(merkez.x, 1.55, genislik * 1.25);
  if (q.get('izgara') !== '1') cam.lookAt(merkez);
  renderer.render(scene, cam);

  // etiketler — DOM (üç.js metin yükü olmasın)
  for (const kt of kartlar) {
    const p = new THREE.Vector3(kt.x, 0, 0).project(cam);
    const el = document.createElement('div');
    el.style.cssText =
      'position:fixed;transform:translate(-50%,0);font:11px/1.35 system-ui;text-align:center;' +
      'color:#263238;background:#ffffffd9;padding:2px 6px;border-radius:4px;white-space:nowrap';
    el.innerHTML = (kt.kafa
      ? `<b style="font-size:14px">kafa ×${String(kt.kafa).replace('.', ',')}</b><br><span style="color:#78909c">${kt.ad}</span>` +
        `<br><b style="color:#00695c">baş payı %${String(kt.basPayi ?? '?').replace('.', ',')}</b>` +
        `<br>BOY ${String(kt.boy).replace('.', ',')}` +
        `<br><span style="color:${kt.omuz > 0.6 ? '#c62828' : '#2e7d32'}">omuz ${String(kt.omuz ?? '?').replace('.', ',')}${kt.omuz > 0.6 ? ' ✗ blob' : ' ✓'}</span>`
      : `<b>${kt.rol ? `${kt.rol}` : kt.ad}</b><br><span style="color:#78909c">${kt.ad}</span><br>×${kt.olcek} → boy ${kt.boy}<br>en ${kt.en}`) +
      (kt.gizlenen ? `<br><span style="color:#c62828">−${kt.gizlenen} ekipman</span>` : '') +
      (kt.poz ? `<br><span style="color:${kt.poz.tuttu ? '#2e7d32' : '#c62828'}">poz ${kt.poz.eslesen ?? 0}/${kt.poz.iz ?? 0} kemik</span>` : '') +
      (kt.kalca != null ? `<br><span style="color:#5d4037">ayaktan asılınca kalça ${kt.kalca}<br>montaj kaldırması +${(0.45 - kt.kalca).toFixed(3)}</span>` : '');
    el.style.left = `${((p.x + 1) / 2) * innerWidth}px`;
    el.style.top = `${((-p.y + 1) / 2) * innerHeight + 8}px`;
    document.body.appendChild(el);
  }
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;top:0;font:12px system-ui;background:#fff;padding:6px 10px;color:#263238';
  bar.textContent =
    `hepsi toplam boy 1,75'e çekildi · mavi çizgi = masa tabla üstü 0,795 · yeşil = tabure oturağı 0,45 · ` +
    `kırmızı kütle = 1,75 m insan${sivil ? ' · SİVİL kip: ekipman düğümleri gizli' : ''}`;
  document.body.appendChild(bar);
  document.title = 'hazir';
</script>
