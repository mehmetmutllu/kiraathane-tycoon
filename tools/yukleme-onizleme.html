<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yükleme ekranı seçenekleri</title>
<style>
  /* Yükleme ekranı adayları — kare çekimi için (tools/yukleme-cek.mjs). ?v=1..4 · pencere cihaz ölçüsünde.
     Görseller docs/logotasarim (kullanıcının ürettiği ikon + logo; lacivert zemin saydama çevrildi). */
  @font-face{font-family:'Baloo 2';font-weight:800;src:url('../node_modules/@fontsource/baloo-2/files/baloo-2-latin-ext-800-normal.woff2') format('woff2');unicode-range:U+0100-02AF}
  @font-face{font-family:'Baloo 2';font-weight:800;src:url('../node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2') format('woff2')}
  :root{--g1:#463c86;--g2:#221b52;--ot:#100b2e;--oyuk:#1b1443;--ac:#ffc24b;--ac2:#e09415;--tx:#eae3ff;--tx2:#a99fd8;--lac:#16122e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--tx)}
  .ekran{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;padding:0 7vw}
  .bar{width:min(62vw,420px);height:22px;border-radius:999px;background:var(--oyuk);border:3px solid var(--ot);box-shadow:inset 0 3px 0 rgba(0,0,0,.35);overflow:hidden}
  .bar i{display:block;height:100%;width:64%;border-radius:999px;background:linear-gradient(180deg,#ffd978,var(--ac) 45%,var(--ac2));box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
  .ipucu{font-weight:800;font-size:clamp(15px,2vh,22px);color:var(--tx2);letter-spacing:.01em}
  .buhar{position:absolute;width:10px;border-radius:8px;background:linear-gradient(0deg,rgba(255,255,255,.0),rgba(255,255,255,.22),rgba(255,255,255,0));filter:blur(3px)}

  /* 1 — LACİVERT SAHNE: logonun kendi zemini, tam görsel */
  .v1{background:var(--lac)}
  .v1 img{width:min(118vw,820px);max-width:none}
  /* 2 — OYUN MORU + IŞIK: arayüzün moru, logonun arkasında amber hâle */
  .v2{background:radial-gradient(120% 80% at 50% 42%,var(--g1) 0%,#352a7a 45%,var(--g2) 100%)}
  .v2::before{content:'';position:absolute;left:50%;top:42%;width:90vw;height:90vw;max-width:720px;max-height:720px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,194,75,.42),rgba(255,194,75,0) 65%)}
  .v2 img{position:relative;width:min(90vw,600px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.4))}
  /* 3 — İKON + TABELA: uygulama ikonu yukarıda, altında logo tabelası */
  .v3{background:linear-gradient(180deg,var(--g1),var(--g2))}
  .v3 .ikon{width:min(46vw,300px);border-radius:22.4%;box-shadow:0 0 0 6px var(--ot),0 24px 50px rgba(0,0,0,.45)}
  .v3 .tabela{width:min(78vw,520px);margin-top:1vh;filter:drop-shadow(0 12px 20px rgba(0,0,0,.35))}
  /* 4 — SADE TABELA: maskotsuz, yalnız logo tabelası + buhar */
  .v4{background:radial-gradient(100% 70% at 50% 45%,#3a3178 0%,var(--g2) 100%)}
  .v4 .tabela{width:min(84vw,560px);filter:drop-shadow(0 14px 24px rgba(0,0,0,.4))}
  .v4 .bardak{font-size:0}
</style>
</head>
<body>
<script>
const v = new URLSearchParams(location.search).get('v') || '1';
const L = '../docs/logotasarim/';
const icerik = {
  1: `<img src="${L}foto.png" alt="">`,
  2: `<img src="${L}logo-maskot-saydam.png" alt="">`,
  3: `<img class="ikon" src="${L}ikon-1024.png" alt=""><img class="tabela" src="${L}logo-yazi-saydam.png" alt="">`,
  4: `<div style="position:relative"><span class="buhar" style="left:44%;top:-120px;height:110px"></span><span class="buhar" style="left:54%;top:-150px;height:140px"></span><img class="tabela" src="${L}logo-yazi-saydam.png" alt=""></div>`,
}[v];
document.body.innerHTML = `<div class="ekran v${v}">${icerik}<div class="bar"><i></i></div><div class="ipucu">Semaver ısınıyor…</div></div>`;
</script>
</body>
</html>
