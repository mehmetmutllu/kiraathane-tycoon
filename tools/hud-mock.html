<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Mock — Köşe Kıraathanesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; background:#222; }
  .phone {
    position:relative; width:390px; height:844px; margin:0 auto; overflow:hidden;
    background:url('hud-mock-backdrop.png') center/cover no-repeat;
    font-family:'Baloo 2', system-ui, sans-serif;
  }

  /* ---------- ortak: şeker-stil metin ---------- */
  .stroke {
    color:#fff; font-weight:800; letter-spacing:.02em;
    paint-order:stroke fill;
    -webkit-text-stroke:4px #3a2410;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }

  /* ---------- üst bar ---------- */
  .top {
    position:absolute; top:0; left:0; right:0; padding:12px 10px 0;
    display:flex; align-items:flex-start; gap:8px; z-index:10;
  }

  /* dişli */
  .gear-btn {
    flex:0 0 auto; width:46px; height:46px; border:none; border-radius:14px;
    background:linear-gradient(#8d6e63,#6d4c41);
    box-shadow:0 4px 0 #3e2723, 0 6px 8px rgba(0,0,0,.35);
    display:grid; place-items:center;
  }
  .gear-btn svg { width:26px; height:26px; }

  /* görev ünitesi: yıldız rozet + bar */
  .quest {
    flex:1 1 auto; position:relative; margin-left:18px; margin-top:2px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
  }
  .quest-pill {
    margin-left:24px; background:linear-gradient(#4e342e,#3b2620);
    border:3px solid #fff; border-radius:22px; padding:5px 12px 6px 30px;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);
  }
  .quest-title {
    font-size:13.5px; font-weight:800; color:#ffe9c7; line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .quest-bar { position:relative; height:16px; margin-top:4px; border-radius:9px; background:#26160f; overflow:hidden; }
  .quest-fill {
    position:absolute; inset:0 38% 0 0; border-radius:9px;
    background:linear-gradient(#9ccc65,#689f38);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.35);
  }
  .quest-count {
    position:absolute; inset:0; display:grid; place-items:center;
    font-family:'Lilita One', 'Baloo 2', sans-serif; font-size:12.5px;
    color:#fff; -webkit-text-stroke:3px #33401d; paint-order:stroke fill;
  }
  .quest-star {
    position:absolute; left:-8px; top:50%; transform:translateY(-50%);
    width:58px; height:58px;
  }
  .quest-star .num {
    position:absolute; inset:0; display:grid; place-items:center; padding-top:4px;
    font-family:'Lilita One', sans-serif; font-size:20px;
    color:#fff; -webkit-text-stroke:4px #8a5a00; paint-order:stroke fill;
  }

  /* sağ para sütunu */
  .currencies { flex:0 0 auto; display:flex; flex-direction:column; gap:8px; align-items:flex-end; padding-right:12px; }
  .chip {
    position:relative; min-width:92px; height:34px; border-radius:17px;
    background:rgba(33,21,13,.78); border:2px solid rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:flex-end;
    padding:0 14px 0 30px; box-shadow:0 3px 6px rgba(0,0,0,.35);
  }
  .chip .icon { position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:42px; height:42px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .chip .val { font-family:'Lilita One', sans-serif; font-size:17px; color:#fff; -webkit-text-stroke:0; letter-spacing:.03em; }
  .chip .plus {
    position:absolute; right:-7px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border-radius:50%;
    background:linear-gradient(#aed581,#7cb342); border:2px solid #fff;
    color:#fff; font-weight:800; font-size:13px; line-height:16px; text-align:center;
    font-family:'Baloo 2',sans-serif;
  }

  /* ---------- dünya-içi örnek: zemin işareti fiyat etiketi (bilgi amaçlı) ---------- */
  .ground-tag {
    position:absolute; left:50%; top:62%; transform:translateX(-50%);
    display:flex; align-items:center; gap:5px;
    background:rgba(33,21,13,.65); border-radius:14px; padding:3px 10px 3px 4px;
    border:2px solid rgba(255,255,255,.7);
  }
  .ground-tag svg { width:22px; height:22px; }
  .ground-tag span { font-family:'Lilita One',sans-serif; font-size:14px; color:#fff; }

  .note {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    font-size:11px; color:rgba(255,255,255,.5); font-weight:600; text-align:center; width:90%;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="top">
    <button class="gear-btn" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13c.04-.32.1-.65.1-1s-.06-.68-.1-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 13.93 2h-4a.5.5 0 0 0-.5.42l-.37 2.65c-.63.26-1.2.6-1.74 1l-2.48-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.45 11c-.04.32-.07.65-.07 1s.03.68.07 1l-2.1 1.65a.5.5 0 0 0-.12.64l2 3.46c.14.24.42.33.6.22l2.5-1c.53.42 1.1.76 1.73 1l.37 2.66c.04.24.25.41.5.41h4c.25 0 .46-.17.5-.41l.37-2.66c.63-.25 1.2-.59 1.74-1l2.48 1c.23.1.47 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13Zm-7.47 2.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>

    <div class="quest">
      <div class="quest-pill">
        <div class="quest-title">3 müşteriye çay götür</div>
        <div class="quest-bar">
          <div class="quest-fill"></div>
          <div class="quest-count">2/3</div>
        </div>
      </div>
      <div class="quest-star">
        <svg viewBox="0 0 64 64">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#ff9800"/>
            </linearGradient>
          </defs>
          <path d="M32 4l8.2 16.6 18.3 2.7-13.2 12.9 3.1 18.2L32 45.8 15.6 54.4l3.1-18.2L5.5 23.3l18.3-2.7L32 4z"
                fill="url(#sg)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
          <path d="M32 10l5.9 12 13.2 1.9-9.6 9.3 2.3 13.2L32 40.2" fill="rgba(255,255,255,.28)"/>
        </svg>
        <div class="num">7</div>
      </div>
    </div>

    <div class="currencies">
      <div class="chip">
        <svg class="icon" viewBox="0 0 48 48">
          <defs>
            <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#f9a825"/>
            </linearGradient>
          </defs>
          <ellipse cx="22" cy="34" rx="15" ry="7" fill="#c17900"/>
          <ellipse cx="22" cy="31" rx="15" ry="7" fill="url(#cg)" stroke="#8d5b00" stroke-width="1.5"/>
          <ellipse cx="26" cy="24" rx="15" ry="7" fill="#c17900"/>
          <ellipse cx="26" cy="21" rx="15" ry="7" fill="url(#cg)" stroke="#8d5b00" stroke-width="1.5"/>
          <ellipse cx="26" cy="20" rx="9" ry="3.6" fill="rgba(255,255,255,.45)"/>
        </svg>
        <span class="val">1.24K</span>
        <span class="plus">+</span>
      </div>
      <div class="chip">
        <svg class="icon" viewBox="0 0 48 48">
          <defs>
            <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#81d4fa"/><stop offset="1" stop-color="#0288d1"/>
            </linearGradient>
          </defs>
          <path d="M14 12h20l8 10-18 16L6 22l8-10z" fill="url(#dg)" stroke="#01579b" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M14 12l10 10L34 12M6 22h36M24 38l-6-16M24 38l6-16" stroke="rgba(255,255,255,.7)" stroke-width="1.4" fill="none"/>
          <path d="M14 12h8l-6 8-8 2 6-10z" fill="rgba(255,255,255,.4)"/>
        </svg>
        <span class="val">12</span>
        <span class="plus">+</span>
      </div>
    </div>
  </div>

  <div class="ground-tag">
    <svg viewBox="0 0 48 48">
      <ellipse cx="24" cy="27" rx="13" ry="6" fill="#c17900"/>
      <ellipse cx="24" cy="24" rx="13" ry="6" fill="#ffd54f" stroke="#8d5b00" stroke-width="1.5"/>
    </svg>
    <span>25</span>
  </div>

  <div class="note">MOCK — zemin fiyat etiketi örnek; gerçek oyunda GroundMarker'da</div>
</div>
</body>
</html>
